# Is the live site up, and are its backups current? Every 15 minutes, from outside.
# A failed run is the alert: GitHub emails the repository owner when a scheduled run fails.
#
# The site:    https://truecountlab.com/healthz must answer {"status":"ok"} (3 tries, 1 minute apart,
#              so a deploy's restart or a blip doesn't page anyone).
# The backups: /healthz reports what deploy/backup-status.sh found on its last hourly run.
#              - that check ran in the last 2.5 hours (the server's timers are alive)
#              - the newest local snapshot is under 27 hours old (they're nightly)
#              - R2 has every change made more than 2 minutes before the check
#
# deploy/autodeploy.sh ignores this job's results (by its name, "Uptime check"),
# so an outage never blocks the deploy that fixes it.
name: Uptime

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  uptime:
    name: Uptime check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Site answers /healthz
        id: site
        run: |
          for try in 1 2 3; do
            if body="$(curl -fsS --max-time 15 -A 'truecountlab-uptime' https://truecountlab.com/healthz)" \
              && [ "$(jq -r .status <<<"$body")" = ok ]; then
              echo "$body" | jq .
              echo "health=$(jq -c . <<<"$body")" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Try $try: the site didn't answer ok (${body:-no response})"
            [ "$try" -lt 3 ] && sleep 60
          done
          echo "::error::truecountlab.com is down: /healthz didn't answer ok 3 times in 2 minutes"
          exit 1

      - name: Backups are current
        env:
          HEALTH: ${{ steps.site.outputs.health }}
        run: |
          b="$(jq -c '.backups' <<<"$HEALTH")"
          echo "$b" | jq .
          fail=0
          problem() { echo "::error::$1"; fail=1; }
          if [ "$b" = null ]; then
            problem "No backup status: deploy/backup-status.sh hasn't run (is truecountlab-backup-status.timer enabled?)"
          else
            checked="$(jq '.checkedMinAgo' <<<"$b")"
            local_h="$(jq '.localHoursAgo' <<<"$b")"
            replica="$(jq -r '.replica' <<<"$b")"
            detail="$(jq -r '.detail // empty' <<<"$b")"
            jq -e '.checkedMinAgo >= 0 and .checkedMinAgo <= 150' <<<"$b" >/dev/null \
              || problem "The hourly backup check last ran $checked minutes ago (its timer may be stopped)"
            jq -e '.localHoursAgo != null and .localHoursAgo <= 27' <<<"$b" >/dev/null \
              || problem "Newest local snapshot is ${local_h} hours old (nightly backup failing?)"
            [ "$replica" = ok ] \
              || problem "R2 replica is '$replica'${detail:+: $detail}"
          fi
          {
            echo "### TrueCountLab"
            echo "- Site: up (commit \`$(jq -r '.commit[0:7]' <<<"$HEALTH")\`, up $(jq -r '.uptime/3600|floor' <<<"$HEALTH") h)"
            echo "- Backups: \`$b\`"
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$fail"
